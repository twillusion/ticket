# Where to collect from. Paths are relative to the repo root.

[storage]
db_path = "data/prices.sqlite"
raw_dir = "data/raw"            # every run's raw captures land here, one folder per run

[stubhub]
event_url = "https://www.stubhub.com/league-of-legends-world-championship-brooklyn-tickets-11-14-2026/event/161251368"
quantity = 2                    # ask StubHub for listings buyable as exactly 2
# StubHub's bot protection is much harder on headless browsers. Leave this false unless
# headless runs are confirmed to work on your machine.
headless = false
# Normal (non-headless) Chrome, but opened far off-screen so scheduled runs don't pop up over
# whatever you're doing. Ignored when headless = true. Test first: collect --offscreen
offscreen = false
# Use your installed Google Chrome instead of Playwright's Chromium ("chrome"), or "" for
# Playwright's bundled Chromium. Real Chrome tends to get blocked less.
browser_channel = "chrome"
# Persistent browser profile, so cookies survive between runs (gitignored).
profile_dir = "data/browser-profile"
# How many times to scroll / click "Show more" to load additional listings. StubHub refused
# the "show more" request with a 403 in testing, so don't count on this; use views instead.
max_load_more = 15

# Filtered views of the same event. StubHub only shows ~10 listings per page load, in its own
# "recommended" order, so one view per tier (your sections selected on the map, sorted by
# price low to high) gets the listings that matter. To make one: open the event in your normal
# browser, select the sections on the map, set sorting to price low -> high, then copy the URL
# from the address bar. quantity=2 is added automatically. With no views, event_url is used.
#
# [[stubhub.views]]
# name = "best"
# url  = "https://www.stubhub.com/...paste..."
#
# [[stubhub.views]]
# name = "good"
# url  = "https://www.stubhub.com/...paste..."
#
# [[stubhub.views]]
# name = "far"
# url  = "https://www.stubhub.com/...paste..."
